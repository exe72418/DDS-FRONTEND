<div class="container py-4">

  <div *ngIf="!crearEditarMode" class="zonas-card">

    <div class="zonas-header center">
      <h5>Zonas</h5>

      <p-button
        label="Nuevo"
        icon="pi pi-plus"
        styleClass="p-button-sm btn-nuevo"
        (onClick)="new()">
      </p-button>
    </div>

    <p-table
      *ngIf="!crearEditarMode"
      [value]="zonas"
      [tableStyle]="{ 'min-width': isMobile ? '100%' : '50rem' }"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-sm p-datatable-striped zonas-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          
          <th *ngIf="!isMobile">Descripción</th>
          
          <th style="width: 120px;">Disponible</th>
          <th class="col-actions">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-zona>
        <tr>
          <td class="fw-semibold">{{ zona.nombre }}</td>
          
          <td *ngIf="!isMobile">{{ zona.descripcion }}</td>

          <td>
            <span class="estado" [class.ok]="zona.disponible" [class.no]="!zona.disponible">
              {{ zona.disponible ? 'Sí' : 'No' }}
            </span>
          </td>

          <td class="col-actions">
            <div class="action-buttons">
              <p-button
                [disabled]="!zona.disponible"
                icon="pi pi-pencil"
                [rounded]="true"
                [outlined]="true"
                severity="success"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="editarZona(zona)">
              </p-button>

              <p-button
                [disabled]="!zona.disponible"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [outlined]="true"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="borrarZona(zona)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isMobile ? 3 : 4" class="empty">
            No hay zonas para mostrar.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>


  <div *ngIf="crearEditarMode" class="form-wrapper">
    <app-crear-zonas
      (editCrear)="changeEditCreate()"
      [zona]="zonaSelected">
    </app-crear-zonas>
  </div>

</div>
