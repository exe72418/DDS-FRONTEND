<div class="container">
  <div *ngIf="!crearEditarMode" style="display: flex; justify-content: center; margin-bottom: 10px;">
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="new()"></p-button>
  </div>

  <p-table *ngIf="!crearEditarMode" [value]="zonas" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Disponible</th>
        <th style="text-align: center;">Editar/Borrar</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-zona>
      <tr>
        <td>{{ zona.nombre }}</td>
        <td>{{ zona.descripcion }}</td>
        <td>{{ zona.disponible }}</td>
        <td>
          <div style="margin-right: 10px; display: flex; justify-content: space-around;">
            <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" severity="success"
              (onClick)="editZona(zona)"></p-button>
            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
              (onClick)="deleteZona(zona)"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div *ngIf="crearEditarMode">
    <app-crear-zonas (editCrear)="changeEditCreate()" [zona]="zonaSelected"></app-crear-zonas>
  </div>
</div>
