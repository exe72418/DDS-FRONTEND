<div class="container py-4">

  <div *ngIf="!crearEditarMode" class="app-card">

    <div class="app-header center">
      <h5>Tipos de Producto</h5>

      <p-button
        label="Nuevo"
        icon="pi pi-plus"
        styleClass="p-button-sm btn-nuevo"
        (onClick)="new()">
      </p-button>
    </div>

    <p-table
      [value]="tiposProducto"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [responsiveLayout]="'scroll'"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-sm p-datatable-striped app-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th style="width: 120px;">Disponible</th>
          <th class="col-actions">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-tipoProducto>
        <tr>
          <td class="fw-semibold">{{ tipoProducto.nombre }}</td>

          <td>
            <span class="estado" [class.ok]="tipoProducto.disponible" [class.no]="!tipoProducto.disponible">
              {{ tipoProducto.disponible ? 'Sí' : 'No' }}
            </span>
          </td>

          <td class="col-actions">
            <div class="action-buttons">
              <p-button
                [disabled]="!tipoProducto.disponible"
                icon="pi pi-pencil"
                [rounded]="true"
                [outlined]="true"
                severity="success"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="editProduct(tipoProducto)">
              </p-button>

              <p-button
                [disabled]="!tipoProducto.disponible"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [outlined]="true"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="deleteProduct(tipoProducto)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="empty">
            No hay tipos de producto para mostrar.
          </td>
        </tr>
      </ng-template>
    </p-table>

  </div>

  <div *ngIf="crearEditarMode" class="form-wrapper">
    <app-crear-tipo-prod
      (editCrear)="changeEditCreate()"
      [tipoProd]="tipoProdSelected">
    </app-crear-tipo-prod>
  </div>

</div>
