<div>
  <div class="form-container">
    <form [formGroup]="tipoProdForm" (ngSubmit)="guardar(tipoProdForm.value)">
      
      <h4 *ngIf="tipoProd?.id; else crearTpl">Modificar Tipo de Producto</h4>
      <ng-template #crearTpl>
        <h4>Registrar Nuevo Tipo de Producto</h4>
      </ng-template>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input 
            pInputText 
            id="nombre" 
            type="text" 
            formControlName="nombre" 
            placeholder="Ej: Electrónica, Bebidas, Limpieza, etc" 
            class="w-full"
        />
      </div>

      <div class="button-group">
        <button pButton label="Cancelar" class="p-button-outlined p-button-secondary" type="button" (click)="back()"></button>
        <button pButton label="Guardar Tipo" severity="primary" type="submit"></button>
      </div>

    </form>
  </div>
</div>
