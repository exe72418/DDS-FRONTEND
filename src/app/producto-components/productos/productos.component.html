<div class="container py-4">

  <div *ngIf="!crearEditarMode" class="productos-card">

    <div class="productos-header center">
      <h5>Productos</h5>

      <p-button
        label="Nuevo"
        icon="pi pi-plus"
        styleClass="p-button-sm btn-nuevo"
        (onClick)="nuevo()">
      </p-button>
    </div>

    <div class="filters-bar">
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre"
        [(ngModel)]="nombreString"
        (change)="buscar()"
        class="filter-input">

      <input
        pInputText
        type="number" 
        placeholder="Precio Mínimo"
        [(ngModel)]="precioMinimo"
        min="0"
        (change)="buscar()"
        class="filter-input-number">

      <input
        pInputText
        type="number"
        placeholder="Precio Máximo"
        [(ngModel)]="precioMaximo"
        min="0"
        (change)="buscar()"
        class="filter-input-number">

      <p-dropdown
        id="tipodeprod"
        [options]="tiposProducto"
        optionLabel="nombre"
        [(ngModel)]="tipoProductoSelect"
        (onChange)="buscar()"
        [showClear]="true"
        placeholder="Tipo Producto"
        styleClass="dropdown-tipo"
        appendTo="body">
      </p-dropdown>
    </div>

    <p-table
      [value]="productos"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [responsiveLayout]="'scroll'"
      [tableStyle]="{ 'min-width': isMobile ? '100%' : '50rem' }"
      styleClass="p-datatable-sm p-datatable-striped productos-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          
          <th *ngIf="!isMobile" style="width: 110px;">Stock</th>
          
          <th style="width: 120px;">Precio</th>
          
          <th *ngIf="!isMobile">Tipo de Producto</th>
          
          <th style="width: 120px;">Disponible</th>
          <th class="col-actions">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-product>
        <tr>
          <td class="fw-semibold">{{ product.descripcion }}</td>
          
          <td *ngIf="!isMobile">{{ product.stock }}</td>
          
          <td>{{ product.precio | currency }}</td>
          
          <td *ngIf="!isMobile">{{ product.tipoProducto?.nombre }}</td>

          <td>
            <span class="estado" [class.ok]="product.disponible" [class.no]="!product.disponible">
              {{ product.disponible ? 'Sí' : 'No' }}
            </span>
          </td>

          <td class="col-actions">
            <div class="action-buttons">
              <p-button
                [disabled]="!product.disponible"
                icon="pi pi-pencil"
                [rounded]="true"
                [outlined]="true"
                severity="success"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="editarProduct(product)">
              </p-button>

              <p-button
                [disabled]="!product.disponible"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [outlined]="true"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="borrarProduct(product)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isMobile ? 4 : 6" class="empty">
            No hay productos para mostrar.
          </td>
        </tr>
      </ng-template>
    </p-table>

  </div>

  <div *ngIf="crearEditarMode" class="form-wrapper">
    <app-crear-productos (editCrear)="cambiarEditarCrear()" [producto]="prodSelected">
    </app-crear-productos>
  </div>

</div>
