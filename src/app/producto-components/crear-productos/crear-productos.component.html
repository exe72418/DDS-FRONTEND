<div style="display: flex; justify-content: center;">
  <p-card>
    <div>
      <form
        style="display: flex; flex-direction: column; justify-content: center;"
        [formGroup]="prodForm"
        (ngSubmit)="guardar(prodForm.value)"
      >
        <h4 *ngIf="producto?.codigo; else crearTpl">Modificar</h4>
        <ng-template #crearTpl>
          <h4>Crear</h4>
        </ng-template>

        <label for="descripcion">Descripcion</label>
        <input pInputText id="descripcion" type="text" formControlName="descripcion" />

        <label for="stock">Stock</label>
        <input pInputText id="stock" type="text" formControlName="stock" />

        <label for="precio">Precio</label>
        <input pInputText id="precio" type="text" formControlName="precio" />

        <label for="tipodeprod">Tipo de Producto</label>
        <p-dropdown
          id="tipodeprod"
          [options]="tiposProducto"
          formControlName="tipoProducto"
          optionLabel="nombre"
          placeholder="Tipo Producto"
        ></p-dropdown>

        <div style="display: flex; justify-content: center;">
          <button style="margin: 10px;" pButton type="submit" label="Guardar"></button>
          <button style="margin: 10px;" pButton type="button" (click)="back()" label="Volver"></button>
        </div>
      </form>
    </div>
  </p-card>
</div>
