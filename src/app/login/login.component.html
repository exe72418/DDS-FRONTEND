<p-card>
    <form *ngIf="!register" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <label for="username">Usuario:</label>
          <input id="username" formControlName="username" type="text" placeholder="Ingresa tu usuario" />
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            <small class="error">El usuario es obligatorio.</small>
          </div>
        </div>
      
        <div>
          <label for="password">Contraseña:</label>
          <input id="password" formControlName="password" type="password" placeholder="Ingresa tu contraseña" />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <small class="error">La contraseña es obligatoria.</small>
          </div>
        </div>
      
        <p-button type="submit" label="Iniciar sesión" severity="success" [disabled]="loginForm.invalid"></p-button>
      </form>

      <form *ngIf="register" [formGroup]="loginForm" (ngSubmit)="registerSubmit()">
        <div>
          <label for="username">Usuario:</label>
          <input id="username" formControlName="username" type="text" placeholder="Ingresa tu usuario" />
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            <small class="error">El usuario es obligatorio.</small>
          </div>
        </div>
      
        <div>
          <label for="password">Contraseña:</label>
          <input id="password" formControlName="password" type="password" placeholder="Ingresa tu contraseña" />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <small class="error">La contraseña es obligatoria.</small>
          </div>
        </div>
      
        <p-button label="Registrar" severity="success" type="submit" [disabled]="loginForm.invalid"></p-button>
      </form>

      <p-button (click)="cambiarRegister()">Iniciar Sesion</p-button> o <p-button (click)="cambiarRegister()">Registrar</p-button>
      
</p-card>
