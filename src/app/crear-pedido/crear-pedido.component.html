<div class="container-fluid">
    
    <p-card styleClass="mb-3">
        <form [formGroup]="pedidoForm" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
            
            <div *ngIf="pedido.nroPedido">
                <label style="font-weight: bold; margin-right: 5px;">Nro Pedido:</label>
                <span>{{ pedido.nroPedido }}</span>
            </div>

            <div class="flex-column">
                <span class="p-float-label">
                    <p-dropdown 
                        id="cliente" 
                        [options]="clientes" 
                        formControlName="cliente" 
                        optionLabel="apellidoNombre"
                        placeholder="Seleccione Cliente" 
                        [showClear]="true" 
                        dataKey="id"
                        [style]="{'width':'250px'}">
                    </p-dropdown>
                </span>
            </div>

            <div class="flex-column">
                <p-calendar 
                    placeholder="Fecha del Pedido" 
                    id="fecha" 
                    formControlName="fecha"
                    dateFormat="dd/mm/yy" 
                    [showIcon]="true"
                    [minDate]="minDateCalendar">
                </p-calendar>
            </div>

            <div style="margin-left: auto; font-size: 1.5rem; font-weight: bold; color: #28a745;">
                Total: {{ pedido.total | currency }}
            </div>
        </form>
    </p-card>

    <div class="d-flex flex-wrap justify-content-center mb-3 gap-2" style="gap: 10px;">
        <input pInputText type="text" placeholder="Buscar producto..." [(ngModel)]="filtroNombre" (keyup)="aplicarFiltros()">
        <input pInputText type="number" placeholder="Precio Min" [(ngModel)]="filtroPrecioMin" (keyup)="aplicarFiltros()">
        <input pInputText type="number" placeholder="Precio Max" [(ngModel)]="filtroPrecioMax" (keyup)="aplicarFiltros()">
        
        <p-dropdown 
            [options]="tiposProducto" 
            [(ngModel)]="filtroTipo" 
            optionLabel="nombre" 
            placeholder="Tipo Producto" 
            [showClear]="true"
            (onChange)="aplicarFiltros()"
            [style]="{'width':'200px'}">
        </p-dropdown>
    </div>

    <div class="tabla" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
        
        <div *ngFor="let product of productosFiltrados">
            <p-card [style]="{ width: '250px', 'text-align': 'center' }">

                <h4 style="margin: 10px 0; font-size: 1.1rem; height: 3em; overflow: hidden;">{{ product.descripcion }}</h4>
                <p style="font-weight: bold;">{{ product.precio | currency }}</p>
                <p style="font-weight: bold; color: #555;">Stock: {{ product.stock }}</p>

                <ng-container *ngIf="getCantidadEnPedido(product) > 0; else botonComprar">
                    
                    <p style="font-size: 1.1rem; font-weight: bold; color: #007ad9;">
                        Cantidad: {{ getCantidadEnPedido(product) }}
                    </p>
                    
                    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                        <button (click)="restar(product)" pButton icon="pi pi-minus" class="p-button-warning p-button-rounded"></button>
                        <button (click)="agregar(product)" pButton icon="pi pi-plus" class="p-button-success p-button-rounded"></button>
                        <button (click)="eliminar(product)" pButton icon="pi pi-trash" class="p-button-danger p-button-rounded"></button>
                    </div>

                </ng-container>

                <ng-template #botonComprar>
                    <div class="flex gap-3 mt-1" style="margin-top: 10px;">
                        <p-button (click)="agregar(product)" label="Comprar" class="w-full" styleClass="w-full" />
                    </div>
                </ng-template>

            </p-card>
        </div>

    </div>

    <div style="display: flex; justify-content: center; margin-top: 30px; margin-bottom: 30px;">
        <button pButton label="Volver" severity="contrast" style="margin-right: 10px;" (click)="back()"></button>
        <button pButton label="Guardar Pedido" severity="success" style="margin-right: 10px;" (click)="savePedido()"></button>
    </div>

</div>
