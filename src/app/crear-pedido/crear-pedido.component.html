<div class="main-wrapper">

    <div class="form-container header-section">
        <form [formGroup]="pedidoForm">
            
            <div class="header-top">
                <h4>
                    <span *ngIf="pedido.nroPedido; else nuevoTit">Pedido #{{ pedido.nroPedido }}</span>
                    <ng-template #nuevoTit>Nuevo Pedido</ng-template>
                </h4>
            </div>

            <div class="header-row">
                
                <div class="form-group flex-item" *ngIf="isAdmin()">
                    <label for="cliente">Cliente</label>
                    <p-dropdown 
                        id="cliente" 
                        [options]="clientes" 
                        formControlName="cliente" 
                        optionLabel="apellidoNombre"
                        placeholder="Seleccione Cliente" 
                        [showClear]="true" 
                        dataKey="id"
                        styleClass="w-full"
                        appendTo="body">
                    </p-dropdown>
                </div>

                <div class="form-group flex-item" *ngIf="!isAdmin()">
                    <label>Cliente</label>
                    <div style="padding: 0.5rem 0.75rem; background: #e9ecef; border: 1px solid #ced4da; border-radius: 6px; min-height: 42px; display: flex; align-items: center;">
                        <span style="font-weight: bold; color: #495057;">
                            {{ clienteControlValue?.apellidoNombre || 'Cargando...' }}
                        </span>
                    </div>
                </div>

                <div class="form-group flex-item">
                    <label for="fecha">Fecha</label>
                    <p-calendar 
                        id="fecha" 
                        formControlName="fecha"
                        placeholder="dd/mm/aaaa"
                        dateFormat="dd/mm/yy" 
                        [showIcon]="true"
                        [minDate]="minDateCalendar"
                        [touchUI]="isMobile" 
                        styleClass="w-full"
                        appendTo="body">
                    </p-calendar>
                </div>

            </div>

            <div class="total-display">
                Total: {{ pedido.total | currency }}
            </div>

        </form>
    </div>

    <div class="filters-bar">
        <input pInputText type="text" placeholder="Buscar producto..." [(ngModel)]="filtroNombre" (keyup)="aplicarFiltros()" class="filter-input search-input">
        <input pInputText type="number" placeholder="Min $" min="0" [(ngModel)]="filtroPrecioMin" (keyup)="aplicarFiltros()" class="filter-input">
        <input pInputText type="number" placeholder="Max $" min="0" [(ngModel)]="filtroPrecioMax" (keyup)="aplicarFiltros()" class="filter-input">
        
        <p-dropdown 
            [options]="tiposProducto" 
            [(ngModel)]="filtroTipo" 
            optionLabel="nombre" 
            placeholder="Tipo Producto" 
            [showClear]="true"
            (onChange)="aplicarFiltros()"
            styleClass="w-full filter-dropdown"
            appendTo="body">
        </p-dropdown>
    </div>

    <div class="product-grid">
        
        <div *ngFor="let product of productosFiltrados" class="product-wrapper">
            <p-card styleClass="product-card">

                <h4 class="prod-title">{{ product.descripcion }}</h4>
                
                <p class="prod-price">{{ product.precio | currency }}</p>
                
                <p class="prod-stock" [ngClass]="{'text-danger': product.stock === 0}">
                    Stock: {{ product.stock }}
                </p>

                <ng-container *ngIf="getCantidadEnPedido(product) > 0; else botonComprar">
                    
                    <p class="cant-display">
                        Cantidad: {{ getCantidadEnPedido(product) }}
                    </p>
                    
                    <div class="control-buttons">
                        <button (click)="restar(product)" pButton icon="pi pi-minus" class="p-button-warning p-button-rounded"></button>
                        
                        <button 
                            (click)="agregar(product)" 
                            pButton 
                            icon="pi pi-plus" 
                            class="p-button-success p-button-rounded"
                            [disabled]="getCantidadEnPedido(product) >= product.stock">
                        </button>

                        <button (click)="eliminar(product)" pButton icon="pi pi-trash" class="p-button-danger p-button-rounded"></button>
                    </div>

                </ng-container>

                <ng-template #botonComprar>
                    <div class="comprar-btn-wrapper">
                        <p-button 
                            (click)="agregar(product)" 
                            label="{{ product.stock === 0 ? 'Sin Stock' : 'Comprar' }}" 
                            styleClass="w-full" 
                            [disabled]="product.stock === 0"/>
                    </div>
                </ng-template>

            </p-card>
        </div>

    </div>

    <div class="button-group main-actions">
        <button pButton label="Volver" severity="secondary" type="button" (click)="back()"></button>
        <button pButton label="Guardar Pedido" severity="success" (click)="savePedido()"></button>
    </div>

</div>
