<div style="width: 100%; padding: 20px;"> 
    
    <h2 style="text-align: center; margin-bottom: 20px;">Detalle del Pedido #{{nroPedido}}</h2>
    
    <p-table 
        [value]="lineas" 
        [style]="{ 'width': '100%' }" 
        [scrollable]="true" 
        scrollHeight="400px">
        
        <ng-template pTemplate="header">
            <tr>
                <th style="text-align: center;">Producto</th>
                <th style="text-align: center;">Cant.</th> 
                <th style="text-align: center;">Precio</th>
                <th style="text-align: center;">Subtotal</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-linea>
            <tr>
                <td>{{ linea.producto.descripcion }}</td>
                <td style="text-align: center;">{{ linea.cantidad }}</td>
                <td style="text-align: center;">{{ linea.producto.precio | currency }}</td>
                <td style="text-align: center; font-weight: bold;">{{ linea.subtotal | currency }}</td>
            </tr>
        </ng-template>
    </p-table>

    <div style="display: flex; justify-content: space-between; margin-top: 20px; align-items: center; padding-top: 15px;">
        <h3 style="margin: 0;">TOTAL: {{ total | currency }}</h3>
        <p-button label="Cerrar" icon="pi pi-times" severity="info" (onClick)="cerrar()"></p-button>
    </div>
</div>
