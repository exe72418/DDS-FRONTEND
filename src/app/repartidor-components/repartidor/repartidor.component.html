<div class="container py-4">

  <div *ngIf="!crearEditarMode" class="repartidores-card">

    <div class="repartidores-header center">
      <h5>Repartidores</h5>

      <p-button
        label="Nuevo"
        icon="pi pi-plus"
        styleClass="p-button-sm btn-nuevo"
        (onClick)="new()">
      </p-button>
    </div>

    <p-table
      [value]="repartidores"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [responsiveLayout]="'scroll'"
      [tableStyle]="{ 'min-width': isMobile ? '100%' : '50rem' }"
      styleClass="p-datatable-sm p-datatable-striped repartidores-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th *ngIf="!isMobile" style="width: 70px;">ID</th>
          <th *ngIf="!isMobile">Cuit</th>
          
          <th>Apellido y Nombre</th>
          
          <th *ngIf="!isMobile">Vehículo</th>
          
          <th>Zona</th>
          <th style="width: 120px;">Disponible</th>
          <th class="col-actions">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-repartidor>
        <tr>
          <td *ngIf="!isMobile">{{ repartidor.id }}</td>
          <td *ngIf="!isMobile">{{ repartidor.cuit }}</td>
          
          <td class="fw-semibold">{{ repartidor.apellidoNombre }}</td>
          
          <td *ngIf="!isMobile">{{ repartidor.vehiculo }}</td>
          
          <td>{{ repartidor.zona?.nombre }}</td>

          <td>
            <span
              class="estado"
              [class.ok]="repartidor.disponible"
              [class.no]="!repartidor.disponible">
              {{ repartidor.disponible ? 'Sí' : 'No' }}
            </span>
          </td>

          <td class="col-actions">
            <div class="action-buttons">
              <p-button
                [disabled]="!repartidor.disponible"
                icon="pi pi-pencil"
                [rounded]="true"
                [outlined]="true"
                severity="success"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="editRepartidor(repartidor)">
              </p-button>

              <p-button
                [disabled]="!repartidor.disponible"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [outlined]="true"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="deleteRepartidor(repartidor)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isMobile ? 4 : 7" class="empty">
            No hay repartidores para mostrar.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div *ngIf="crearEditarMode" class="form-wrapper">
    <app-crear-repartidores
      (editCrear)="changeEditCreate()"
      [repartidor]="repartidorSelected">
    </app-crear-repartidores>
  </div>

</div>
