<div class="container py-4">

  <div *ngIf="!crearMode" class="pedidos-card">

    <div class="pedidos-header center">
      <h5>Pedidos</h5>

      <button
        pButton
        icon="pi pi-plus"
        routerLink="/home"
        label="Crear Pedido"
        class="p-button-sm btn-nuevo">
      </button>
    </div>

    <p-table
      *ngIf="!crearMode"
      [value]="pedidos"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [responsiveLayout]="'scroll'"
      [tableStyle]="{ 'min-width': isMobile ? '100%' : '50rem' }"
      styleClass="p-datatable-sm p-datatable-striped pedidos-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th *ngIf="isAdmin() && !isMobile" pSortableColumn="cliente.apellidoNombre">
            Cliente <p-sortIcon field="cliente.apellidoNombre"></p-sortIcon>
          </th>
          
          <th *ngIf="!isMobile" pSortableColumn="entrega.id" style="width: 110px;">
            Entrega <p-sortIcon field="entrega.id"></p-sortIcon>
          </th>
          
          <th pSortableColumn="fecha" style="width: 120px;">
            Fecha <p-sortIcon field="fecha"></p-sortIcon>
          </th>
          
          <th *ngIf="!isMobile" pSortableColumn="pago.id" style="width: 110px;">
            Pago <p-sortIcon field="pago.id"></p-sortIcon>
          </th>
          
          <th pSortableColumn="total" style="width: 120px;">
            Total <p-sortIcon field="total"></p-sortIcon>
          </th>
          
          <th style="width: 80px; text-align: center;">Detalles</th>
          
          <th class="col-actions">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-pedido>
        <tr>
          <td *ngIf="isAdmin() && !isMobile" class="fw-semibold">{{ pedido.cliente?.apellidoNombre }}</td>
          
          <td *ngIf="!isMobile">{{ pedido.entrega ? pedido.entrega.id : '—' }}</td>
          
          <td>{{ pedido.fecha | date: 'dd/MM/yyyy' }}</td>
          
          <td *ngIf="!isMobile">{{ pedido.pago ? pedido.pago.id : '—' }}</td>
          
          <td>{{ pedido.total | currency }}</td>

          <td class="text-center">
            <p-button
              icon="pi pi-eye"
              severity="info"
              [rounded]="true"
              [outlined]="true"
              styleClass="p-button-sm p-button-icon-only"
              (onClick)="showProductDetails(pedido)"
              pTooltip="Ver productos">
            </p-button>
          </td>

          <td class="col-actions">
            <div class="action-buttons">
              <p-button
                [disabled]="pedido.pago"
                icon="pi pi-pencil"
                [rounded]="true"
                [outlined]="true"
                severity="success"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="editProduct(pedido)">
              </p-button>

              <p-button
                [disabled]="pedido.entrega"
                icon="pi pi-trash"
                [rounded]="true"
                [outlined]="true"
                severity="danger"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="deleteProduct(pedido)">
              </p-button>

              <p-button
                [disabled]="pedido.pago"
                icon="pi pi-dollar"
                [rounded]="true"
                [outlined]="true"
                severity="help"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="irAPago(pedido)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="4 + (isAdmin() && !isMobile ? 1 : 0) + (isMobile ? 0 : 2)" class="empty">
            No hay pedidos para mostrar.
          </td>
        </tr>
      </ng-template>

    </p-table>

  </div>

  <app-crear-pedido
    (editCrear)="changeEditCreate()"
    [pedido]="pedidoSelected"
    *ngIf="crearMode">
  </app-crear-pedido>

</div>
