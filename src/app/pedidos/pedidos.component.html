<div class=" col justify-content-center">
  <div class="col" *ngIf="!crearMode" style="display: flex; justify-content: center; margin-bottom: 20px;">
    <button pButton icon="pi pi-plus" routerLink="/home">Crear</button>
  </div>
  <div  class="d-flex flex-wrap justify-content-center mb-3 text-white" *ngIf="!crearMode">
    <label class="m-2" for="cliente">Cliente:</label>
    <p-dropdown
                    id="cliente"
                    [options]="clientes"
                    [(ngModel)]="clienteSelect"
                    optionLabel="apellidoNombre"
                    [showClear]="true"
                    placeholder="Clientes"
                    (onChange)="buscar()" />

    <label class="m-2" for="fechaInicio">Fecha de inicio: </label>
    <input pInputText (change)="buscar()" id="fechaInicio" type="date" [(ngModel)]="fechaInicio" name="fechaInicio">

    <label class="m-2" for="fechaFin">Fecha de fin: </label>
    <input pInputText (change)="buscar()" id="fechaFin" type="date" [(ngModel)]="fechaFin" name="fechaFin">

  </div>

  <div class="col">
    <p-table *ngIf="!crearMode" [value]="pedidos" [tableStyle]="{ 'min-width': '50rem' }" class="table-striped">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="cliente.apellidoNombre" >Cliente <p-sortIcon field="code" /></th>
          <th pSortableColumn="entrega.id ">Entrega <p-sortIcon field="code" /></th>
          <th pSortableColumn="fecha">Fecha <p-sortIcon field="code" /></th>
          <th pSortableColumn="pago.id">Pago <p-sortIcon field="code" /></th>
          <th pSortableColumn="total">Total <p-sortIcon field="code" /></th>
          <th >Lineas</th>
          <th style="text-align: center;">Editar/Borrar</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-pedido of="pedidos">
        <tr>
          <td>{{ pedido.cliente.apellidoNombre }}</td>
          <td>
            <div *ngIf="pedido.entrega != null">
              {{ pedido.entrega.id }}
            </div>
          </td>
          <td>{{ pedido.fecha | date: 'dd/MM/yyyy'}}</td>
          <td *ngIf="pedido.pago">{{ pedido.pago.id }}</td>
          <td *ngIf="!pedido.pago"> </td>
          <td>{{ pedido.total }}</td>
          <td>
            <div *ngFor="let linea of pedido.lineas">
              {{linea.id}}
            </div>
          </td>
          <td>
            <div style="margin-right: 10px; display: flex; justify-content: space-around;">
              <p-button icon="pi pi-pencil" class="mr-2" rounded true outlined true severity="success" (onClick)="editProduct(pedido)" />
              <p-button icon="pi pi-trash" severity="danger" rounded true outlined true (onClick)="deleteProduct(pedido)" />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <app-crear-pedido (editCrear)="changeEditCreate()" [pedido]="pedidoSelected" *ngIf="crearMode"></app-crear-pedido>
</div>
