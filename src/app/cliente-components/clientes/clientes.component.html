<div *ngIf="!crearEditarMode" style="display: flex; justify-content: center; margin-bottom: 10px;">
  <p-button label="Nuevo" icon="pi pi-plus" (onClick)="new()"></p-button>
</div>
<div class="tabla-centrada">
  <p-table *ngIf="!crearEditarMode" [value]="clientes" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Apellido y Nombre</th>
        <th>Teléfono</th>
        <th>CUIT</th>
        <th>Email</th>
        <th>Domicilio</th>
        <th>Disponible</th>
        <th>Zona</th>
        <th style="text-align: center;">Editar/Borrar</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-cliente>
      <tr>
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.apellidoNombre }}</td>
        <td>{{ cliente.telefono }}</td>
        <td>{{ cliente.cuit }}</td>
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.domicilio }}</td>
        <td>{{ cliente.disponible}}</td>
        <td>{{cliente.zona}}</td>
        <td>
          <div style="margin-right: 10px; display: flex; justify-content: space-around;">
            <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" severity="success"
              (onClick)="editCliente(cliente)"></p-button>
            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
              (onClick)="deleteCliente(cliente)"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div *ngIf="crearEditarMode">
    <app-crear-clientes (editCrear)="changeEditCreate()" [cliente]="clienteSelected"></app-crear-clientes>
  </div>
</div>
