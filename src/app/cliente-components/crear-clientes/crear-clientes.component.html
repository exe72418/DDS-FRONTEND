<div class="main-wrapper">
    <div class="form-container">
      <form [formGroup]="clienteForm" (ngSubmit)="guardar(clienteForm.value)">
        
        <h4 *ngIf="cliente?.id; else crearTpl">Modificar Cliente</h4>
        <ng-template #crearTpl>
          <h4>Registrar Nuevo Cliente</h4>
        </ng-template>

        <div class="form-group">
          <label for="apellidoNombre">Nombre y Apellido</label>
          <input pInputText id="apellidoNombre" type="text" formControlName="apellidoNombre" placeholder="Ej: Lionel Messi" class="w-full"/>
        </div>

        <div class="form-group">
          <label for="cuit">CUIT</label>
          <input pInputText id="cuit" type="text" formControlName="cuit" class="w-full"/>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input pInputText id="email" type="text" formControlName="email" placeholder="nombre@ejemplo.com" class="w-full"/>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input pInputText id="telefono" type="text" formControlName="telefono" class="w-full"/>
        </div>

        <div class="form-group">
          <label for="domicilio">Domicilio</label>
          <input pInputText id="domicilio" type="text" formControlName="domicilio" class="w-full"/>
        </div>

        <div class="form-group">
          <label for="zona">Zona</label>
          <p-dropdown
            id="zona"
            [options]="zonas"
            formControlName="zona"
            optionLabel="nombre"
            placeholder="Seleccione una zona"
            [showClear]="true"
            styleClass="w-full"
            appendTo="body" 
          ></p-dropdown>
          </div>

        <div class="button-group">
            <button pButton label="Cancelar" class="p-button-outlined p-button-secondary" type="button" (click)="back()"></button>
            <button pButton label="Guardar Cliente" severity="primary" type="submit"></button>
        </div>

      </form>
    </div>
</div>
