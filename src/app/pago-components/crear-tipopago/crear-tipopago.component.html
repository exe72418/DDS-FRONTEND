<div>
  <div class="form-container">
    <form [formGroup]="tipoPagoForm" (ngSubmit)="guardar(tipoPagoForm.value)">
      
      <h4 *ngIf="tipoPago?.id; else crearTpl">Modificar Tipo de Pago</h4>
      <ng-template #crearTpl>
        <h4>Registrar Nuevo Tipo de Pago</h4>
      </ng-template>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input 
            pInputText 
            id="nombre" 
            type="text" 
            formControlName="nombre" 
            placeholder="Ej: Efectivo, Tarjeta, QR, etc" 
        />
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <input 
            pInputText 
            id="descripcion" 
            type="text" 
            formControlName="descripcion" 
            placeholder="Ej: Pago directo en mostrador" 
        />
      </div>

      <div class="button-group">
        <button pButton label="Cancelar" class="p-button-outlined p-button-secondary" type="button" (click)="back()"></button>
        <button pButton label="Guardar Tipo Pago" severity="primary" type="submit"></button>
      </div>

    </form>
  </div>
</div>
