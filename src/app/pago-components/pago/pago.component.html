<div class="container py-4">

  <div *ngIf="!crearEditarModePago" class="pagos-card">

    <div class="pagos-header">
      <h5>Pagos</h5>

      <p-button
        label="Nuevo"
        icon="pi pi-plus"
        styleClass="p-button-sm btn-nuevo"
        (onClick)="new()">
      </p-button>
    </div>

    <p-table
      [value]="pagos"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [responsiveLayout]="'scroll'"
      [tableStyle]="{ 'min-width': isMobile ? '100%' : '50rem' }"
      styleClass="p-datatable-sm p-datatable-striped pagos-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th *ngIf="!isMobile" style="width: 80px;">Id</th>
          
          <th style="width: 120px;">Fecha</th>
          
          <th *ngIf="!isMobile">Tipo de Pago</th>
          <th *ngIf="!isMobile" style="width: 120px;">Pedido ID</th>

          <th *ngIf="!isMobile && isAdmin()">Cliente</th>
          
          <th style="width: 100px; text-align: center;">Detalle</th>
          
          <th class="col-actions" *ngIf="isAdmin()">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-pago>
        <tr>
          <td *ngIf="!isMobile">{{ pago.id }}</td>
          
          <td>{{ pago.fecha | date: 'dd/MM/yyyy' }}</td>
          
          <td *ngIf="!isMobile">{{ pago.tipoPago?.nombre }}</td>
          <td *ngIf="!isMobile">{{ pago.pedido?.nroPedido }}</td>

          <td *ngIf="!isMobile && isAdmin()">
            {{ pago.pedido?.cliente?.apellidoNombre || '-' }}
          </td>

          <td class="text-center">
            <p-button
              icon="pi pi-eye"
              severity="info"
              [rounded]="true"
              [outlined]="true"
              styleClass="p-button-sm p-button-icon-only"
              (onClick)="showDetallePedido(pago.pedido)"
              pTooltip="Ver Detalle">
            </p-button>
          </td>

          <td class="col-actions" *ngIf="isAdmin()">
            <div class="action-buttons">
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [disabled]="true"
                [outlined]="true"
                severity="success"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="editPago(pago)">
              </p-button>

              <p-button
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [outlined]="true"
                styleClass="p-button-sm p-button-icon-only"
                (onClick)="deletePago(pago)">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="(isMobile ? 2 : 4) + (isAdmin() ? 1 : 0) + (isMobile ? 0 : 1)" class="empty">
            No hay pagos para mostrar.
          </td>
        </tr>
      </ng-template>
    </p-table>

  </div>

  <div *ngIf="crearEditarModePago" class="form-wrapper">
    <app-crear-pago
      (editCrear)="cambiarEditarCrear()"
      [pago]="pagoSelected"
      [nroPedidoPreseleccionado]="pedidoHijo">
    </app-crear-pago>
  </div>

</div>
