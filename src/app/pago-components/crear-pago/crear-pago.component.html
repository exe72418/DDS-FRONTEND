<div>
  <div class="form-container">
    <form [formGroup]="pagoForm" (ngSubmit)="guardar(pagoForm.value)">
      
      <h4 *ngIf="pago?.id; else crearTpl">Modificar Pago</h4>
      <ng-template #crearTpl>
        <h4>Registrar Nuevo Pago</h4>
      </ng-template>

      <div class="form-group">
        <label for="fecha">Fecha</label>
        <p-calendar
          id="fecha"
          formControlName="fecha"
          placeholder="dd/mm/aaaa"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          [touchUI]="isMobile" 
          styleClass="w-full"
          appendTo="body"
        ></p-calendar>
      </div>

      <div class="form-group">
        <label for="tipoPago">Tipo de Pago</label>
        <p-dropdown
          id="tipoPago"
          [options]="tiposPago"
          formControlName="tipoPago"
          optionLabel="nombre"
          placeholder="Seleccione método"
          dataKey="id"
          styleClass="w-full"
          appendTo="body"
        ></p-dropdown>
      </div>

      <div class="form-group">
        <label for="pedido">Pedido</label>
        <p-dropdown
          id="pedido"
          [options]="pedidosDisponibles"
          formControlName="pedido"
          optionLabel="nroPedido"
          placeholder="Seleccione un pedido"
          dataKey="nroPedido"
          styleClass="w-full"
          appendTo="body"
        ></p-dropdown>
      </div>

      <div *ngIf="pedidoSeleccionado" class="resumen-wrapper">
        <p-card header="Resumen del Pedido" styleClass="resumen-card">
            
           <div class="lista-resumen">
               <div *ngFor="let linea of pedidoSeleccionado.lineas" class="item-linea">
                   
                   <div class="nombre-prod">
                       {{ linea.producto?.descripcion }}
                   </div>

                   <div class="detalles-prod">
                       <span><span class="label">Cant:</span> {{ linea.cantidad }}</span>
                       <span class="separador">|</span>
                       <span><span class="label">Precio:</span> {{ linea.producto?.precio | currency }}</span>
                       <span class="separador">|</span>
                       <span class="subtotal-item">Subtotal: {{ (linea.subtotal || (linea.cantidad * linea.producto?.precio!)) | currency }}</span>
                   </div>

               </div>
           </div>

           <div class="total-bloque">
               <hr class="separador-total">
               <div class="fila-total">
                   <span class="label-total">Total a Pagar:</span>
                   <span class="precio-final">{{ pedidoSeleccionado.total | currency }}</span>
               </div>
           </div>

        </p-card>
      </div>
      
      <div class="button-group">
        <button pButton label="Cancelar" class="p-button-outlined p-button-secondary" type="button" (click)="back()"></button>
        <button pButton label="Guardar Pago" severity="primary" type="submit"></button>
      </div>

    </form>
  </div>
</div>
